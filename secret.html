<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Repository</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="gradient-bg"></div>
    
    <!-- PIN Authentication Modal -->
    <div id="pinModal" class="pin-modal">
        <div class="pin-modal-content">
            <div class="pin-modal-body">
                <div class="pin-icon">🔐</div>
                <div class="pin-modal-header">
                    <h2>Access Required</h2>
                    <p>Enter your PIN to continue</p>
                </div>
                <div class="pin-input-container">
                    <input 
                        type="password" 
                        id="pinInput" 
                        class="pin-input" 
                        placeholder="•••••" 
                        maxlength="5"
                        autocomplete="off"
                        inputmode="numeric"
                    >
                </div>
                <div id="pinError" class="pin-error" style="display: none;"></div>
                <button id="pinSubmitBtn" class="pin-submit-btn">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Add File Modal -->
    <div id="addFileModal" class="add-file-modal hidden">
        <div class="add-file-modal-content">
            <div class="add-file-modal-header">
                <h2>Add New File</h2>
                <button class="close-modal-btn" id="closeAddFileModal">&times;</button>
            </div>
            <form id="addFileForm" class="add-file-form">
                <div class="form-group">
                    <label for="fileName">File Name *</label>
                    <input type="text" id="fileName" required placeholder="Enter file name">
                </div>

                <div class="form-group">
                    <label for="fileDesc">Description *</label>
                    <textarea id="fileDesc" required placeholder="Enter file description" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fileSize">File Size *</label>
                        <div class="size-input-group">
                            <input type="number" id="fileSizeNum" required placeholder="Enter size" min="0" step="0.1">
                            <select id="fileSizeUnit">
                                <option value="KB">KB</option>
                                <option value="MB" selected>MB</option>
                                <option value="GB">GB</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fileLink">Download Link *</label>
                    <input type="url" id="fileLink" required placeholder="https://example.com/file">
                </div>

                <div class="form-group">
                    <label for="fileIcon">Icon Image (PNG/JPG) *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fileIcon" accept="image/*" required>
                        <span class="file-input-label">Choose Image or Drag & Drop</span>
                    </div>
                    <div id="iconPreview" class="icon-preview hidden">
                        <img id="iconPreviewImg" src="" alt="Preview">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="form-btn cancel-btn" id="cancelAddFileBtn">Cancel</button>
                    <button type="submit" class="form-btn submit-btn">Add File</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1>🔓 Secret Vault</h1>
                    <p class="subtitle">restricted access only</p>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-number" id="fileCount">0</span>
                        <span class="stat-label">Files</span>
                    </div>
                    <button id="addFileBtn" class="add-file-btn" title="Add a new file">+ Add File</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <section class="files-section">
                <div class="section-header">
                    <h2>Secret Files</h2>
                    <p class="section-description">Upload and manage your restricted files</p>
                </div>

                <div class="files-grid" id="filesGrid">
                    <!-- Files will be dynamically inserted here -->
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📁</div>
                    <p>No files available yet</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; Secret Vault Access Granted.</p>
        </footer>
    </div>

    <script src="files.js"></script>
    <!-- Firebase SDK (Compat version for global access) -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="secret-script.js"></script>
</body>
</html>
